version: '3.8'

services:
  lazyeasm:
    build: .
    container_name: lazyeasm
    ports:
      - "10001:10001"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_USER_ID=${DISCORD_USER_ID:-}
    restart: unless-stopped
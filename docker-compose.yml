version: '3.8'

services:
  lazyeasm:
    build: .
    container_name: lazyeasm
    ports:
      - "10002:10001"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Host port above, for the printed address; PUBLIC_IP (optional) is shown
      # there and added to the self-signed HTTPS certificate
      - PUBLIC_PORT=10002
      - PUBLIC_IP=${PUBLIC_IP:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_USER_ID=${DISCORD_USER_ID:-}
    restart: unless-stopped
    healthcheck:
      # /health checks the database and the worker heartbeat (no auth from localhost)
      # HTTPS when TLS_MODE is on (-k: the certificate may be self-signed), plain HTTP otherwise
      test: ["CMD-SHELL", "curl -fsSk -o /dev/null https://localhost:10001/health || curl -fsS -o /dev/null http://localhost:10001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
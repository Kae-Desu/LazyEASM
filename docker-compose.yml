version: '3.8'

services:
  lazyeasm:
    build: .
    container_name: lazyeasm
    ports:
      - "10002:10001"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_USER_ID=${DISCORD_USER_ID:-}
    restart: unless-stopped
    healthcheck:
      # /health checks the database and the worker heartbeat (no auth from localhost)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:10001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
name: Bug report
description: Something in LazyEASM does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, real scan results or data about hosts you do not own; use `example.com` and documentation IPs (203.0.113.x) instead. Report security vulnerabilities privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Submit example.com on the Scans page
        2. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker (./start.sh)
        - Native service (sudo ./start.sh --service)
        - Native foreground (./start.sh --native)
        - Manual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or the output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `./start.sh --logs`, `journalctl -u lazyeasm` or `logs/`. Remove anything sensitive.
      render: text
